<div id="static-landing" data-layout="wallet-split">
  <nav class="topnav" aria-label="me path">

    <header>
      <h1>Who paid what?</h1>
      <p class="lead">Who paid, who was in. Balances and transfers update as you go.</p>
    </header>
    <section data-split-app aria-label="Split">
      <p class="needs-js">The split runs in the browser with JavaScript.</p>
    </section>
    <section data-planned>
      <p class="planned-tag">Planned · Meta model</p>
      <form data-wallet-entry onsubmit="return false">
        <label for="wallet-who-paid-what" hidden>Describe in plain language</label>
        <textarea id="wallet-who-paid-what" placeholder="Describe it in plain language" disabled></textarea>
        <div class="row">
          <button type="button" data-wallet-photo disabled aria-label="Add a receipt photo">Receipt photo</button>
          <button type="submit" data-wallet-go disabled>Split</button>
        </div>
      </form>
    </section>
    <p class="note">Paypal .me · a demo for the PayPal AI hackathon · in development. This page does not send anything yet.</p>
  </main>
